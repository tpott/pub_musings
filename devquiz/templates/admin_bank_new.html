{% extends "base.html" %}

{% block title %}Create Question Bank - DevQuiz{% endblock %}

{% block content %}
<div class="admin-header">
    <h1>Create Question Bank</h1>
    <a href="/admin" class="btn">&larr; Back to Dashboard</a>
</div>

<form action="/admin/bank/create" method="POST" class="admin-form">
    <div class="form-group">
        <label for="name">Bank Name *</label>
        <input type="text" id="name" name="name" required placeholder="e.g., Python Basics">
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="3" placeholder="Describe the topic or category of questions..."></textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create Bank</button>
        <a href="/admin" class="btn">Cancel</a>
    </div>
</form>
{% endblock %}
