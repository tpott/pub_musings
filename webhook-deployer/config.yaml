sites:
  - name: personal
    path: /home/trevor/pub_musings/personal
    path_prefix: personal/
    branch: trunk
    repository: tpott/pub_musings
    repo_path: /home/trevor/pub_musings
    commands:
      - "git checkout trunk"
      - "git pull origin trunk"
      - ". ~/.nvm/nvm.sh && nvm use"
      - "npm ci"
      - "npm run build"

  - name: subtitler-frontend
    path: /home/trevor/pub_musings/subtitler/frontend
    path_prefix: subtitler/frontend/
    branch: trunk
    repository: tpott/pub_musings
    repo_path: /home/trevor/pub_musings
    deploy_script: /home/trevor/pub_musings/webhook-deployer/scripts/deploy-subtitler-frontend.sh

  - name: subtitler-backend
    path: /home/trevor/pub_musings/subtitler/backend
    path_prefix: subtitler/backend/
    branch: trunk
    repository: tpott/pub_musings
    repo_path: /home/trevor/pub_musings
    deploy_script: /home/trevor/pub_musings/webhook-deployer/scripts/deploy-subtitler-backend.sh

  - name: peekaboo-frontend
    path: /home/trevor/pub_musings/peekaboo/frontend
    path_prefix: peekaboo/frontend/
    branch: trunk
    repository: tpott/pub_musings
    repo_path: /home/trevor/pub_musings
    deploy_script: /home/trevor/pub_musings/webhook-deployer/scripts/deploy-peekaboo-frontend.sh

  - name: peekaboo-backend
    path: /home/trevor/pub_musings/peekaboo
    path_prefix: peekaboo/
    branch: trunk
    repository: tpott/pub_musings
    repo_path: /home/trevor/pub_musings
    deploy_script: /home/trevor/pub_musings/webhook-deployer/scripts/deploy-peekaboo-backend.sh
    environment:
      BACKEND_PORT: 9070
